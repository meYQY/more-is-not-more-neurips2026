# Grok 4.1 Fast via OpenRouter (reasoning DISABLED)
model:
  name: "x-ai/grok-4.1-fast"
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"
generation:
  temperature: 0.7
  max_tokens: 4096
  top_p: 1.0
  frequency_penalty: 0
  presence_penalty: 0
extra_body:
  reasoning:
    enabled: false
system_prompt: "You are a helpful assistant."
experiment:
  n_responses: 20
  max_concurrent: 50
sequential:
  n_turns: 3
  follow_up: "What else do you think about this topic?"
