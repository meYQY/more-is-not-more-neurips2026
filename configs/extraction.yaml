# Extraction config: extract opinion statements from raw responses.
# Uses DeepSeek (same as generation) — tested against GPT-4.1/5.4 variants,
# DeepSeek produces the cleanest claim-level extraction at lowest cost.

model:
  name: "deepseek-chat"
  base_url: "https://api.deepseek.com"
  api_key_env: "DEEPSEEK_API_KEY"

generation:
  temperature: 0
  max_tokens: 8192
  top_p: 1.0
  frequency_penalty: 0
  presence_penalty: 0
