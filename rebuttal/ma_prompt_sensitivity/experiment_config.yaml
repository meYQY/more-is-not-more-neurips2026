experiment:
  name: "rebuttal_multiagent_prompt_ablation"
  seed: 1529
  n_tasks: 100
  n_agents: 5
  n_rounds: 3
  persona_ids: [1, 2, 3, 4, 5]
  persona_depth: "pro"
  max_concurrent_calls: 20
  round1_task_concurrency: 4
  branch_concurrency: 12

model:
  name: "deepseek-v4-flash"
  base_url: "https://api.deepseek.com"
  api_key_env: "DEEPSEEK_API_KEY"

generation:
  temperature: 0.7
  max_tokens: 4096
  top_p: 1.0
  frequency_penalty: 0
  presence_penalty: 0

extra_body:
  thinking:
    type: "disabled"

system_prompt: "You are a helpful assistant."

prompts:
  round1: |-
    A group is discussing the following question. Please share your perspective.

    Question: {question}
  neutral:
    round2: "Please respond to the discussion."
    round3: "Please continue the discussion."
  agreement:
    round2: "Please respond to the discussion. Actively seek areas of agreement and work toward a shared conclusion, while clearly stating any genuine differences that remain."
    round3: "Please continue the discussion. Actively seek areas of agreement and work toward a shared conclusion, while clearly stating any genuine differences that remain."
  disagreement:
    round2: "Please respond to the discussion. Actively surface genuine differences, counterarguments, and distinct conclusions, while acknowledging any genuine agreement that remains."
    round3: "Please continue the discussion. Actively surface genuine differences, counterarguments, and distinct conclusions, while acknowledging any genuine agreement that remains."

source:
  repository: "../.."  # repository root, relative to this folder; override with MODBENCH_ROOT
  tasks: "data/dataset/tasks.csv"
  personas: "configs/personas.yaml"
