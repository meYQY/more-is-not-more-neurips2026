# Extraction config: Kimi K2.5 for cross-extractor validation.
# Same prompt as DeepSeek extraction, different LLM.

model:
  name: "kimi-k2.5"
  base_url: "https://api.moonshot.cn/v1"
  api_key_env: "KIMI_API_KEY"

generation:
  temperature: 0.6
  max_tokens: 8192
  top_p: 0.95
  frequency_penalty: 0
  presence_penalty: 0

extra_body:
  thinking:
    type: "disabled"
