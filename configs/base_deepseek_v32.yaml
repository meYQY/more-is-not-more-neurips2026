# DeepSeek V3.2 via OpenRouter
# For new conditions to match the model version used in existing data.

model:
  name: "deepseek/deepseek-v3.2"
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"

generation:
  temperature: 0.7
  max_tokens: 4096
  top_p: 1.0
  frequency_penalty: 0
  presence_penalty: 0

system_prompt: "You are a helpful assistant."

experiment:
  n_responses: 20
  max_concurrent: 100

sequential:
  n_turns: 3
  follow_up: "What else do you think about this topic?"
