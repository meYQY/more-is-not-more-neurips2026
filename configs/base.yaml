# Base experiment configuration
# All conditions share these parameters unless explicitly overridden.

model:
  name: "deepseek-chat"
  base_url: "https://api.deepseek.com"
  api_key_env: "DEEPSEEK_API_KEY"

generation:
  temperature: 0.7
  max_tokens: 4096
  top_p: 1.0
  frequency_penalty: 0
  presence_penalty: 0

system_prompt: "You are a helpful assistant."

experiment:
  n_responses: 20           # Independent calls per question per condition
  max_concurrent: 50        # Max simultaneous API requests per task

sequential:
  n_turns: 3
  follow_up: "What else do you think about this topic?"
