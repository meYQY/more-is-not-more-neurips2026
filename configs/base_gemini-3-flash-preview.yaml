# Base config for google/gemini-3-flash-preview via OpenRouter

model:
  name: "google/gemini-3-flash-preview"
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"

generation:
  temperature: 0.7
  max_tokens: 4096
  top_p: 1.0
  frequency_penalty: 0
  presence_penalty: 0

system_prompt: "You are a helpful assistant."

experiment:
  n_responses: 20
  max_concurrent: 50

sequential:
  n_turns: 3
  follow_up: "What else do you think about this topic?"
